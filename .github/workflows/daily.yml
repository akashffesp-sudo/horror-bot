name: Daily Shorts

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      lang:
        description: "Language"
        type: choice
        options: [hi, en]
        default: hi
      dry_run:
        description: "Build video only, do not upload"
        type: boolean
        default: true

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Pick language
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lang=${{ github.event.inputs.lang }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "lang=hi" >> "$GITHUB_OUTPUT"
          else
            echo "lang=en" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        run: python bot.py ${{ steps.pick.outputs.lang }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          PRIVACY: private

      - name: Keep video and trend report
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ steps.pick.outputs.lang }}
          path: output/*
          retention-days: 3
